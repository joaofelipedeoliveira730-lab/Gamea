<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON PATH</title><link rel="stylesheet" href="style.css"><script src="/socket.io/socket.io.js"></script><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js"}}</script></head><body>
<section id="authPanel" class="panel auth-panel">
  <div class="auth-brand"><div class="logo">NEON <span>PATH</span></div><p class="sub">CORRA. EVOLUA. PRESTIGIE.</p></div>
  <div class="auth-switch" role="tablist" aria-label="Autenticação">
    <button id="showLogin" class="auth-tab active" type="button">ENTRAR</button>
    <button id="showRegister" class="auth-tab" type="button">CADASTRAR</button>
  </div>
  <div id="loginForm" class="auth-form">
    <label>APELIDO</label>
    <input id="authNick" maxlength="20" autocomplete="username" placeholder="Digite seu apelido">
    <label>SENHA</label>
    <input id="authPassword" type="password" minlength="8" maxlength="200" autocomplete="current-password" placeholder="Digite sua senha">
    <button id="loginBtn" class="primary-auth" type="button">ENTRAR</button>
    <button id="toRegister" class="link-auth" type="button">Ainda não tenho conta · Cadastrar</button>
  </div>
  <div id="registerForm" class="auth-form hidden">
    <label>APELIDO</label>
    <input id="registerNick" maxlength="20" autocomplete="username" placeholder="Escolha seu apelido">
    <label>SENHA</label>
    <input id="registerPassword" type="password" minlength="8" maxlength="200" autocomplete="new-password" placeholder="Mínimo de 8 caracteres">
    <label>E-MAIL <span>(opcional)</span></label>
    <input id="registerEmail" type="email" maxlength="160" autocomplete="email" placeholder="Você pode deixar vazio">
    <button id="registerBtn" class="primary-auth" type="button">CRIAR CONTA</button>
    <button id="toLogin" class="link-auth" type="button">Já tenho conta · Entrar</button>
  </div>
  <div id="authMsg" aria-live="polite"></div>
</section>
<section id="profilePanel" class="panel" hidden>
  <div class="profile-head">
    <div><b id="profileNick"></b><small id="profilePrestige"></small></div>
    <div class="level-badge">LV <span id="profileLevel">1</span></div>
  </div>
  <div class="xp-bar"><i id="xpFill"></i></div>
  <div id="xpText"></div>
  <h3>PERSONAGENS</h3><div id="characterGrid"></div>
  <button id="prestigeBtn" class="prestige-btn" hidden>ASCENDER AO PRESTÍGIO</button>
</section>
<div id="app" hidden>
<section id="menu" class="screen"><div class="hero"><div class="logo">NEON<span>PATH</span></div><div class="tag">RACE THE LIGHT • SURVIVE THE CIRCUIT</div><div class="panel"><input id="nick" maxlength="20" placeholder="Apelido"><button id="create">CRIAR NOVA SALA</button><button id="join">ENTRAR EM SALA EXISTENTE</button><button id="rank">RANKING GLOBAL</button><div class="row"><input id="room" maxlength="8" placeholder="Código da sala"><button id="quality">QUALIDADE: AUTO</button></div><div id="msg"></div></div></div></section>
<section id="lobby" class="screen hidden"><div class="lobby"><h1>LOBBY <b id="roomCode">----</b></h1><div id="players"></div><button id="start" class="hidden">INICIAR CORRIDA</button><button id="back">VOLTAR</button></div></section>
<section id="game" class="hidden"><canvas id="scene"></canvas><div class="hud"><div class="top"><div class="brand">NEON PATH</div><div id="lap">LAP 1/3</div><div id="timer">00:00</div></div><div id="score" class="score"></div><div class="bottom"><div class="energy"><span>ENERGY</span><div><i id="bar"></i></div><small>SHIFT / TURBO</small></div><div class="actions"><button id="turbo">TURBO</button><button id="sab">SABOTAGE</button></div><div class="mini"><canvas id="map" width="180" height="110"></canvas></div></div></div></section></div><script type="module" src="app.js"></script>
<section id="shopPanel" class="panel" hidden>
 <div class="store-title"><span>NEON</span> MARKET</div>
 <div class="store-tabs"><button data-store-tab="shop">LOJA</button><button data-store-tab="inv">INVENTÁRIO</button></div>
 <div id="shopGrid"></div><div id="inventoryGrid" hidden></div>
</section>
</body></html>
