<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#030612">
<title>NEON PATH</title>
<link rel="stylesheet" href="style.css">
<script src="/socket.io/socket.io.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.178.0/build/three.module.js"}}</script>
</head>
<body>
<section id="authPanel" class="fullscreen-auth">
  <div class="auth-shell">
    <div class="auth-brand"><div class="logo">NEON <span>PATH</span></div><p>CORRA. EVOLUA. PRESTIGIE.</p></div>
    <div class="auth-switch"><button id="showLogin" class="auth-tab active" type="button">ENTRAR</button><button id="showRegister" class="auth-tab" type="button">CADASTRAR</button></div>
    <form id="loginForm" class="auth-form" autocomplete="on">
      <label for="authNick">APELIDO</label><input id="authNick" maxlength="20" autocomplete="username" placeholder="Digite seu apelido" required>
      <label for="authPassword">SENHA</label><input id="authPassword" type="password" minlength="8" maxlength="200" autocomplete="current-password" placeholder="Digite sua senha" required>
      <button id="loginBtn" class="primary-auth" type="submit">ENTRAR</button>
      <button id="toRegister" class="link-auth" type="button">Ainda não tenho conta · Cadastrar</button>
    </form>
    <form id="registerForm" class="auth-form hidden" autocomplete="on">
      <label for="registerNick">APELIDO</label><input id="registerNick" maxlength="20" autocomplete="username" placeholder="Escolha seu apelido" required>
      <label for="registerPassword">SENHA</label><input id="registerPassword" type="password" minlength="8" maxlength="200" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" required>
      <label for="registerEmail">E-MAIL <span>(opcional)</span></label><input id="registerEmail" type="email" maxlength="160" autocomplete="email" placeholder="Pode deixar vazio">
      <button id="registerBtn" class="primary-auth" type="submit">CRIAR CONTA</button>
      <button id="toLogin" class="link-auth" type="button">Já tenho conta · Entrar</button>
    </form>
    <div id="authMsg" aria-live="polite"></div>
  </div>
</section>

<div id="app" hidden>
<section id="menu" class="screen">
  <div class="hero"><div class="logo">NEON<span>PATH</span></div><div class="tag">RACE THE LIGHT • SURVIVE THE CIRCUIT</div>
    <div class="panel menu-panel">
      <label for="nick">APELIDO</label><input id="nick" maxlength="20" placeholder="Apelido">
      <button id="create">CRIAR NOVA SALA</button>
      <button id="join">ENTRAR EM SALA EXISTENTE</button>
      <button id="rank">RANKING GLOBAL</button>
      <div class="room-box">
        <label for="room">CÓDIGO DA SALA <small>máx. 15</small></label><input id="room" maxlength="15" inputmode="text" autocomplete="off" placeholder="Código da sala">
        <label for="roomKey">CHAVE DA SALA</label><input id="roomKey" maxlength="200" type="password" autocomplete="off" placeholder="Chave (se houver)">
      </div>
      <div class="room-hint">CEO TESTE: <b>Velho202026</b> • chave protegida</div>
      <button id="quality">QUALIDADE: AUTO</button>
      <button id="logout" class="secondary">SAIR DA CONTA</button>
      <div id="msg" aria-live="polite"></div>
    </div>
  </div>
</section>
<section id="lobby" class="screen hidden"><div class="lobby"><h1>LOBBY <b id="roomCode">----</b></h1><div id="players"></div><button id="start" class="hidden">INICIAR CORRIDA</button><button id="back">VOLTAR</button></div></section>
<section id="game" class="hidden"><canvas id="scene"></canvas><div class="hud"><div class="top"><div class="brand">NEON PATH</div><div id="lap">LAP 1/3</div><div id="timer">00:00</div></div><div id="score" class="score"></div><div class="bottom"><div class="energy"><span>ENERGY</span><div><i id="bar"></i></div><small>SHIFT / TURBO</small></div><div class="actions"><button id="turbo">TURBO</button><button id="sab">SABOTAGE</button></div><div class="mini"><canvas id="map" width="180" height="110"></canvas></div></div></div></section>
<section id="shopPanel" class="panel" hidden><div class="store-title"><span>NEON</span> MARKET</div><div class="store-tabs"><button data-store-tab="shop">LOJA</button><button data-store-tab="inv">INVENTÁRIO</button></div><div id="shopGrid"></div><div id="inventoryGrid" hidden></div></section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
